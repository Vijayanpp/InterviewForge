overrides:
  zod: 4.0.17

# The lockfile already pins exact, previously-installed versions; there's no
# supply-chain benefit to also delaying fresh installs of those same pinned
# versions (e.g. in CI/Docker), so this is safe to disable per-project.
minimumReleaseAge: 0

# pnpm 11 blocks dependency postinstall scripts unless explicitly allowed
# (ERR_PNPM_IGNORED_BUILDS). Approve the packages Next/eslint need.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
