# Local Judge0 CE for InterviewForge coding challenges.
#
# Usage (from interviewforge/):
#   docker compose -f docker/judge0/docker-compose.yml up -d
#   # wait ~30–60s for first boot, then:
#   curl http://localhost:2358/about
#
# Then in .env.local:
#   CODE_EXECUTION_PROVIDER=judge0
#   JUDGE0_URL=http://localhost:2358
#
# Note: Judge0 needs privileged containers (isolate sandbox). Docker Desktop
# on Windows/macOS usually works; Linux hosts are the most reliable.

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    <<: *default-logging
    restart: unless-stopped
    depends_on:
      - db
      - redis

  worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: unless-stopped
    depends_on:
      - db
      - redis

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - judge0_data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7.2.4
    command:
      [
        "bash",
        "-c",
        'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"',
      ]
    env_file: judge0.conf
    <<: *default-logging
    restart: unless-stopped

volumes:
  judge0_data:
